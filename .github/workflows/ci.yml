name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check whitespace
        run: git show --format= --check HEAD

  browser:
    name: Browser (${{ matrix.suite }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, scale, travel, mini, design, offline, deployment]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run browser suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p test-results
          if [ "$SUITE" != offline ] && [ "$SUITE" != deployment ]; then
            npm run dev > test-results/server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
                break
              fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          fi
          npm run "test:$SUITE" 2>&1 | tee test-results/suite.log
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
