name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test
        run: npm test
      - name: Restore published assets for cached pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_SITE_DIR: ${{ runner.temp }}/previous-site
        run: node scripts/restore-deployment.mjs
      - name: Build production site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PREVIOUS_SITE_DIR: ${{ runner.temp }}/previous-site
        run: npm run build
      - name: Retain immutable assets for future deployments
        uses: actions/upload-artifact@v4
        with:
          name: site-assets
          path: |
            dist/
            !dist/data/**
            !dist/**/*.br
            !dist/**/*.gz
          retention-days: 90
          if-no-files-found: error
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
